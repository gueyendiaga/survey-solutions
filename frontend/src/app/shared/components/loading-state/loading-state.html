<section class="loading mb-4 flex flex-col items-center gap-3 rounded-2xl border border-[var(--line)] bg-white px-6 py-12 text-center text-[var(--text-2)] shadow-[var(--shadow)]" aria-live="polite">
  <span class="relative grid h-[76px] w-[76px] shrink-0 place-items-center rounded-full bg-[radial-gradient(circle,_#fff_52%,_#f5f7fc_100%)] shadow-[0_0_0_8px_rgba(30,_51,_152,_0.045)]">
    <span aria-hidden="true" class="absolute -inset-[5px] animate-spin rounded-full border-[3px] border-[#e8ebf4] border-r-[var(--primary-2)] border-t-[var(--primary)] motion-reduce:animate-none"></span>
    <img src="logo.png" alt="" aria-hidden="true" class="relative z-10 block h-12 w-12 object-contain drop-shadow-[0_2px_3px_rgba(17,_38,_91,_0.12)]">
  </span>
  @if (importing) {
    <strong class="text-[var(--text)]">Import des données en cours…</strong>
    <span class="max-w-[460px] text-[var(--fs-small)] leading-relaxed">Les indicateurs s’afficheront automatiquement à la fin de la synchronisation.</span>
  } @else {
    <strong class="text-[var(--text)]">{{ label }}</strong>
  }
</section>
