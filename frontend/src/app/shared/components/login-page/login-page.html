<main class="login-page [position:relative] [display:grid] [min-height:100vh] [overflow:hidden] [place-items:center] [padding:32px_20px] [background:radial-gradient(ellipse_at_12%_8%,_rgba(91,_107,_192,_0.14),_transparent_34%),_radial-gradient(ellipse_at_88%_94%,_rgba(30,_51,_152,_0.08),_transparent_32%),_#f6f7fb] [&::before]:[position:absolute] [&::before]:[width:360px] [&::before]:[height:360px] [&::before]:[border:1px_solid_rgba(30,_51,_152,_0.055)] [&::before]:[border-radius:50%] [&::before]:[content:''] [&::before]:[pointer-events:none] [&::after]:[position:absolute] [&::after]:[width:360px] [&::after]:[height:360px] [&::after]:[border:1px_solid_rgba(30,_51,_152,_0.055)] [&::after]:[border-radius:50%] [&::after]:[content:''] [&::after]:[pointer-events:none] [&::before]:[top:-230px] [&::before]:[right:-80px] [&::before]:[box-shadow:0_0_0_34px_rgba(30,_51,_152,_0.018),_0_0_0_68px_rgba(30,_51,_152,_0.014)] [&::after]:[bottom:-270px] [&::after]:[left:-160px] [&::after]:[width:430px] [&::after]:[height:430px] [&::after]:[box-shadow:0_0_0_38px_rgba(30,_51,_152,_0.016)] [@media(max-width:480px)]:[padding:18px_14px]">
  <section class="login-card [position:relative] [z-index:1] [width:min(100%,_440px)] [padding:40px] [border:1px_solid_rgba(223,_228,_239,_0.95)] [border-radius:22px] [background:rgba(255,_255,_255,_0.97)] [box-shadow:0_24px_70px_rgba(28,_41,_82,_0.1),_0_3px_10px_rgba(28,_41,_82,_0.035)] [@media(max-width:480px)]:[padding:30px_24px] [@media(max-width:480px)]:[border-radius:18px]" aria-labelledby="login-title">
    <span class="login-mark [display:grid] [width:48px] [height:48px] [overflow:hidden] [place-items:center] [border:1px_solid_#e4e8f4] [border-radius:13px] [background:#fff] [box-shadow:0_2px_6px_rgba(28,_41,_82,_0.05)]" aria-hidden="true">
      <img ngSrc="logo.png" alt="" width="46" height="46" class="[.login-mark_&]:[width:100%] [.login-mark_&]:[height:100%] [.login-mark_&]:[object-fit:contain]">
    </span>
    <p class="eyebrow [margin:25px_0_7px] [color:var(--primary)] [font-size:10px] [font-weight:700] [letter-spacing:0.15em]">SURVEY ANALYTICS</p>
    <h1 id="login-title" class="[margin:0] [color:#1c2740] [font-size:30px] [font-weight:700] [letter-spacing:-0.045em] [line-height:1.2] [@media(max-width:480px)]:[font-size:27px]">Connexion</h1>
    <p class="login-intro [color:#6f788c] [font-size:13px] [line-height:1.6] [margin:10px_0_25px]">Connectez-vous avec votre compte Survey Solutions ayant le rôle API.</p>

    @if (connectionError()) {
      <p class="login-alert [margin:0_0_14px] [padding:11px_12px] [border:1px_solid_#f0caca] [border-radius:9px] [background:#fff5f5] [color:#963b3b] [font-size:13px] [line-height:1.45]" role="alert">{{ connectionError() }}</p>
    }
    @if (error()) {
      <p class="login-alert [margin:0_0_14px] [padding:11px_12px] [border:1px_solid_#f0caca] [border-radius:9px] [background:#fff5f5] [color:#963b3b] [font-size:13px] [line-height:1.45]" role="alert">{{ error() }}</p>
    }

    <form (ngSubmit)="submit()" class="[display:grid] [gap:9px]">
      <label for="username" class="[margin-top:5px] [color:#35405a] [font-size:12px] [font-weight:600]">Nom d'utilisateur HQ</label>
      <input id="username" name="username" type="text" autocomplete="username"
        [(ngModel)]="username" required [disabled]="submitting()" class="[width:100%] [min-height:46px] [padding:10px_13px] [border:1px_solid_#dfe3eb] [border-radius:10px] [background:#fcfcfe] [color:#25304a] [font-size:14px] [transition:border-color_140ms_ease,_background_140ms_ease,_box-shadow_140ms_ease] [:hover:not(:disabled)]:[border-color:#c9d0df] [:hover:not(:disabled)]:[background:#fff] [:focus]:[border-color:var(--primary-2)] [:focus]:[outline:3px_solid_rgba(30,_51,_152,_0.12)] [:focus]:[background:#fff] [@media(prefers-reduced-motion:reduce)]:[transition:none]">
      <label for="password" class="[margin-top:5px] [color:#35405a] [font-size:12px] [font-weight:600]">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
        [(ngModel)]="password" required [disabled]="submitting()" class="[width:100%] [min-height:46px] [padding:10px_13px] [border:1px_solid_#dfe3eb] [border-radius:10px] [background:#fcfcfe] [color:#25304a] [font-size:14px] [transition:border-color_140ms_ease,_background_140ms_ease,_box-shadow_140ms_ease] [:hover:not(:disabled)]:[border-color:#c9d0df] [:hover:not(:disabled)]:[background:#fff] [:focus]:[border-color:var(--primary-2)] [:focus]:[outline:3px_solid_rgba(30,_51,_152,_0.12)] [:focus]:[background:#fff] [@media(prefers-reduced-motion:reduce)]:[transition:none]">
      <button type="submit" [disabled]="submitting() || !username.trim() || !password" class="[min-height:47px] [margin-top:12px] [border:1px_solid_var(--primary)] [border-radius:10px] [background:var(--primary)] [color:#fff] [font:inherit] [font-size:13px] [font-weight:600] [cursor:pointer] [box-shadow:0_4px_10px_rgba(30,_51,_152,_0.16)] [transition:border-color_140ms_ease,_background_140ms_ease,_box-shadow_140ms_ease,_transform_140ms_ease] [:disabled]:[cursor:not-allowed] [:disabled]:[opacity:0.58] [:disabled]:[box-shadow:none] [:hover:not(:disabled)]:[border-color:var(--primary-hover)] [:hover:not(:disabled)]:[background:var(--primary-hover)] [:hover:not(:disabled)]:[box-shadow:0_6px_14px_rgba(30,_51,_152,_0.22)] [:active:not(:disabled)]:[transform:translateY(1px)] [@media(prefers-reduced-motion:reduce)]:[transition:none]">
        {{ submitting() ? 'Connexion…' : 'Se connecter' }}
      </button>
    </form>
    <p class="login-footnote [color:#6f788c] [font-size:13px] [line-height:1.6] [margin:19px_0_0] [padding-top:15px] [border-top:1px_solid_#f0f2f6] [font-size:11px]">Vos identifiants sont vérifiés par HQ et ne sont pas enregistrés.</p>
  </section>
</main>
