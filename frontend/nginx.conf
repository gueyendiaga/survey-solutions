server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Fichiers générés (nom avec empreinte) : un fichier absent est une vraie 404, jamais
    # index.html servi à la place d'un script après un redéploiement.
    location ~* \.(?:js|mjs|css|map|woff2?|ttf|png|jpe?g|svg|ico|webp)$ {
        try_files $uri =404;
    }

    # index.html toujours revalidé : un redéploiement est pris en compte au rechargement suivant.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
