<div class="shell" [class.sidebar-collapsed]="sidebarCollapsed">
  <nav class="sidebar" aria-label="Navigation principale">
    <a class="brand" routerLink="/">
      <span class="brand-mark" aria-hidden="true">
        <img ngSrc="logo.png" alt="ANSD LOGO" width="35" height="35">
      </span>
      <strong class="brand-name">Survey solutions</strong>
    </a>
    <div class="nav-links">
      <a class="nav-item"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" /><rect x="13" y="3" width="8" height="8" /><rect x="3" y="13" width="8" height="8" /><rect x="13" y="13" width="8" height="8" /></svg>
        <span class="nav-label">Tableau de bord</span>
      </a>
      <a class="nav-item"
        routerLink="/questionnaires"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        aria-label="Afficher le catalogue des questionnaires">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01" /></svg>
        <span class="nav-label">Questionnaires</span>
        @if (catalog.questionnaires().length) {
          <span class="nav-count">{{ catalog.questionnaires().length }}</span>
        }
      </a>
    </div>

    <div class="sidebar-status">
      <strong><span class="status-dot" aria-hidden="true"></span>HQ connecté</strong>
      <span class="status-details">Survey Solutions Headquarters · synchronisation automatique</span>
    </div>
  </nav>

  <div class="main-col">
    <router-outlet />
  </div>
</div>
