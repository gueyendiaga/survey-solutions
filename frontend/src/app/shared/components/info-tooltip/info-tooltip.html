<span class="info-tooltip" (mouseenter)="show($event)" (mouseleave)="hide()">
  <button
    type="button"
    class="info-tooltip__trigger"
    [attr.aria-label]="'Comment ce chiffre est calculé : ' + text"
    [attr.aria-describedby]="tooltipId"
    [attr.aria-expanded]="visible"
    (focus)="show($event)"
    (blur)="hide()"
    (click)="show($event)">
    i
  </button>
  @if (visible) {
    <span
      class="info-tooltip__bubble"
      [class.info-tooltip__bubble--above]="placement === 'above'"
      [style.left.px]="left"
      [style.top.px]="top"
      [attr.id]="tooltipId"
      role="tooltip">{{ text }}</span>
  }
</span>
