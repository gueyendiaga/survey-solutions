@if (!posed) {
  <span class="quality-status ds-pill gray"><i class="dot"></i>Non posée</span>
} @else if (item.missingCount) {
  <span class="quality-status review-needed ds-pill orange"><i class="dot"></i>À examiner</span>
} @else {
  <span class="quality-status complete ds-pill green"><i class="dot"></i>Complet</span>
}
