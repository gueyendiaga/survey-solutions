<main class="page questionnaires-page">
  <div class="page-head">
    <div class="page-intro">
      <span class="eyebrow"><span class="eyebrow-mark"></span>VOTRE ESPACE DE TRAVAIL</span>
      <h1>Questionnaires</h1>
      <p class="lead">Retrouvez les questionnaires et versions accessibles depuis Survey Solutions HQ.</p>
    </div>
    <button class="btn refresh-button" type="button" (click)="catalog.refresh()" [disabled]="catalog.loading()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5" /><path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2" /></svg>
      Actualiser
    </button>
  </div>

  @if (catalog.error(); as message) {
    <section class="alert" role="alert">
      <div><strong>Les données ne sont pas disponibles</strong><p>{{ message }}</p></div>
      <button type="button" class="btn" (click)="catalog.refresh()">Réessayer</button>
    </section>
  }

  @if (catalog.loading() && !catalog.questionnaires().length) {
    <app-loading-state label="Chargement des questionnaires…" />
  } @else {
    <section class="card">
      <app-questionnaire-catalog [questionnaires]="catalog.questionnaires()" />
    </section>
  }
</main>
