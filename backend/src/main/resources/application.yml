server:
  port: 8081
  error:
    include-message: never

spring:
  datasource:
    url: ${ANALYTICS_DB_URL:jdbc:postgresql://localhost:5433/analytics}
    username: ${ANALYTICS_DB_USERNAME:analytics}
    password: ${ANALYTICS_DB_PASSWORD:}
  flyway:
    enabled: true

survey-solutions:
  base-url: ${SURVEY_SOLUTIONS_BASE_URL:http://localhost:8080}
  workspace: ${SURVEY_SOLUTIONS_WORKSPACE:primary}
  sync-interval: ${ANALYTICS_SYNC_INTERVAL:PT30M}
  export-timeout: ${ANALYTICS_EXPORT_TIMEOUT:PT30M}
  report-organization: ${ANALYTICS_REPORT_ORGANIZATION:Survey Solutions Analytics}
  report-retention: ${ANALYTICS_REPORT_RETENTION:30}
  # Génération automatique des rapports (cron Spring : s m h j M jS), heure de Dakar (UTC).
  report-cron: ${ANALYTICS_REPORT_CRON:0 0 7 * * *}
  username: ${SURVEY_SOLUTIONS_USERNAME:}
  password: ${SURVEY_SOLUTIONS_PASSWORD:}
  allowed-origin: ${ANALYTICS_ALLOWED_ORIGIN:http://localhost:4200}
  connect-timeout: 5s
  read-timeout: 30s
  analysis-statuses: ${ANALYTICS_STATUSES:Completed,ApprovedBySupervisor,ApprovedByHeadquarters}
